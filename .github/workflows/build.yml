name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller reportlab pillow
      - name: Build
        run: pyinstaller stitchchart.spec
      - name: Package
        run: Compress-Archive -Path dist/StitchChart -DestinationPath StitchChart-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StitchChart-Windows
          path: StitchChart-Windows.zip
